apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  labels:
    app.kubernetes.io/name: aiops-saas
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/aiops_db"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  PORT: "8080"
  JWT_EXPIRATION_MS: "86400000"
