spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiops_db}
    username: ${DATABASE_USERNAME:aiops_user}
    password: ${DATABASE_PASSWORD:aiops_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: WARN
    com.aiops: INFO
